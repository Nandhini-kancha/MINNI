[build]
  functions = "netlify/functions"
  publish = "app/static"

[functions]
  node_bundler = "esbuild"

# Redirect API requests to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Serve SPA index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
